<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0D0F17" stroke="#00F0FF" stroke-width="3"/>
  <!-- Globe Sphere Base -->
  <circle cx="32" cy="32" r="21" fill="#141824" stroke="#00F0FF" stroke-width="3"/>
  <!-- Longitude Ellipse -->
  <ellipse cx="32" cy="32" rx="10.5" ry="21" fill="none" stroke="#39FF14" stroke-width="2"/>
  <!-- Central Prime Meridian -->
  <line x1="32" y1="11" x2="32" y2="53" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Equator Line -->
  <line x1="11" y1="32" x2="53" y2="32" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Northern Latitude Arc -->
  <path d="M 16 22 Q 32 29 48 22" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Southern Latitude Arc -->
  <path d="M 16 42 Q 32 35 48 42" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Neo-brutalist Birth / Demographic Ping Marker -->
  <circle cx="39" cy="25" r="3.5" fill="#39FF14" stroke="#0D0F17" stroke-width="1.5"/>
</svg>
